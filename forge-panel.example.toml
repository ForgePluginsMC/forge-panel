# forge-panel example config — copy to forge-panel.toml and edit.
[panel]
bind = "127.0.0.1:8090"
data_dir = "/opt/forge-panel/data"
default_java = "/usr/bin/java"

# Example game server
[[servers]]
name = "survival"
dir = "/opt/minecraft/survival"
jar = "paper.jar"
jvm_args = ["-Xms1G", "-Xmx2G"]
port = 25570
rcon_port = 25575
rcon_password = "changeme"
xms_mb = 1024
xmx_mb = 2048
mc_version = "1.21"

