# Example REMOTE server: runs on another machine, managed over RCON only.
# The panel never starts/stops it, binds no local ports for it, and offers
# no files/backups/plugins — just status, players, TPS, and an RCON console.
# Local servers need no RCON at all (console goes straight to the process).
