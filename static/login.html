<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE-PANEL // Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      'neon-cyan': '#00f0ff', 'neon-amber': '#ff9900', 'neon-crimson': '#ff2a5f',
      'panel': '#09111c', 'panel-border': '#15293f',
    },
    fontFamily: {
      orbitron: ['Orbitron', 'sans-serif'],
      mono: ['"Share Tech Mono"', 'monospace'],
      code: ['"JetBrains Mono"', 'monospace'],
    }
  } }
}
</script>
<style>
body {
  background-color: #04080e;
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
  background-size: 32px 32px;
}
.hud-bracket-container { position: relative; }
.hud-bracket-container::before {
  content: ''; position: absolute; top: -1px; left: -1px; width: 12px; height: 12px;
  border-top: 2px solid #ff9900; border-left: 2px solid #ff9900; pointer-events: none;
}
.hud-bracket-container::after {
  content: ''; position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px;
  border-bottom: 2px solid #ff9900; border-right: 2px solid #ff9900; pointer-events: none;
}
.clip-tech-chamfer {
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
</style>
</head>
<body class="min-h-screen flex items-center justify-center font-mono">
<div class="w-full max-w-md mx-4">
<div class="hud-bracket-container bg-[#08111c] border border-panel-border rounded-sm p-8">
<div class="flex items-center justify-center space-x-3 mb-2">
<div class="w-10 h-10 rounded border border-neon-amber/50 bg-neon-amber/10 flex items-center justify-center text-neon-amber">
<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 2C9.5 6 12 8.5 10 11.5C9 10 8 9.5 8 9.5C6 12.5 7 16 9 18C7.5 18 6 16.5 6 15C4.5 17.5 5 20.5 8 22C11 23.5 16 23 18 19C20 15 17 11 15 10C15 10 15.5 12 14 13C12.5 14 11 12 12 9C12.5 7.5 13.5 5.5 12 2Z"/></svg>
</div>
<span class="font-orbitron font-extrabold tracking-widest text-2xl text-white">FORGE-PANEL</span>
</div>
<p class="text-center text-xs text-slate-500 tracking-widest uppercase mb-8">Mission Control // Secure Access</p>

<div id="setup-block" style="display:none">
<p class="text-sm text-slate-400 mb-4">First run — set your admin password.</p>
<label class="block text-[11px] font-orbitron tracking-wider text-slate-400 uppercase mb-1">Password (min 8 chars)</label>
<input type="password" id="pw1" autocomplete="new-password" class="w-full bg-[#040910] border border-panel-border rounded px-3 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-neon-cyan mb-3">
<label class="block text-[11px] font-orbitron tracking-wider text-slate-400 uppercase mb-1">Confirm</label>
<input type="password" id="pw2" autocomplete="new-password" class="w-full bg-[#040910] border border-panel-border rounded px-3 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-neon-cyan mb-4">
<button id="setup-btn" class="w-full bg-neon-amber hover:bg-amber-400 text-black font-orbitron font-extrabold tracking-wider py-2.5 rounded-sm clip-tech-chamfer">CREATE ADMIN</button>
</div>

<div id="login-block" style="display:none">
<label class="block text-[11px] font-orbitron tracking-wider text-slate-400 uppercase mb-1">Password</label>
<input type="password" id="pw" autocomplete="current-password" class="w-full bg-[#040910] border border-panel-border rounded px-3 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-neon-cyan mb-4">
<button id="login-btn" class="w-full bg-neon-amber hover:bg-amber-400 text-black font-orbitron font-extrabold tracking-wider py-2.5 rounded-sm clip-tech-chamfer">LOG IN</button>
</div>

<p class="text-neon-crimson text-sm font-mono mt-4 text-center" id="err"></p>
</div>
<p class="text-center text-[10px] text-slate-600 mt-4 font-mono">FORGE-PANEL SYSTEMS © 2024</p>
</div>

<script src="/static/app.js?v=2"></script>
<script>
(async () => {
  const err = document.getElementById("err");
  let needed = true;
  try {
    const r = await fetch("/api/setup-needed");
    needed = (await r.json()).needed;
  } catch (e) { err.textContent = "can't reach panel: " + e.message; return; }
  document.getElementById(needed ? "setup-block" : "login-block").style.display = "block";

  async function doSetup() {
    const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
    if (a.length < 8) { err.textContent = "password must be at least 8 characters"; return; }
    if (a !== b) { err.textContent = "passwords don't match"; return; }
    try { await api("POST", "/api/setup", { password: a }); window.location.href = "/login"; }
    catch (e) { err.textContent = e.message; }
  }
  async function doLogin() {
    const pw = document.getElementById("pw").value;
    try { await api("POST", "/api/login", { password: pw }); window.location.href = "/"; }
    catch (e) { err.textContent = e.message; }
  }
  document.getElementById("setup-btn").onclick = doSetup;
  document.getElementById("login-btn").onclick = doLogin;
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") { needed ? doSetup() : doLogin(); }
  });
})();
</script>
</body>
</html>
